        <link rel="stylesheet" href="post.css"> 
        <link rel="stylesheet" href="Home.css">
    </head>
    <body>
        <img src="Logo_real3.png" alt="Atlas Social" class="img-menu-logo">
    <div class="boxforbutton"></div>
        <div class="menu">
            <a href="Profile.html" class="Button-link">
                <button class="Button" type="button">
                    <img src="account.png">
                    Profile

            <a href="Home.html" class="Button-link">
                <button class="Button" type="button">
                    <img src="House.png">

    <!-- Floating Bioluminescent Spores -->
    <div class="spore-container" id="sporeContainer"></div>
     <main class="feed-section">
            <!-- Box to Create a New Post -->
            <section class="post-box-card glass-card">
                <h3>Share an Eco-Friendly Suggestion</h3>
                <!-- maxlength limits character count so it never scrolls down -->
                <textarea id="suggestionInput" maxlength="150" placeholder="How can we protect the planet today? (e.g. Plant a native flower)"></textarea>
                <button id="postBtn">Post Suggestion</button>
                <p id="postStatus" class="post-status" role="status"></p>
            </section>

               <!-- File Input Area -->
    <div class="file-upload-wrapper">
        <label for="fileInput" class="upload-btn">
            📷 Attach Photo / File
        </label>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <span id="fileName" class="file-name">No photo selected</span>
    </div>
    </main>


    </body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
